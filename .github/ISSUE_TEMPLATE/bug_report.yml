name: Bug 反馈
description: 转换失败、报错、界面异常等情况
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先看一眼 README 的「常见问题」，
        并确认**没有上传包含隐私的原始文件**（可以只描述、或改用脱敏样本）。
  - type: input
    id: version
    attributes:
      label: fconv 版本
      description: 界面页脚、`fconv version` 或 `GET /api/health` 里的版本号
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他（请在描述里说明）
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.13.12"
    validations:
      required: false
  - type: input
    id: pair
    attributes:
      label: 涉及的格式转换
      description: 源格式 → 目标格式
      placeholder: "png → jpg"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 双击 启动fconv.vbs
        2. 拖入 xxx.png
        3. 选 jpg，点转换
        4. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或报错原文
      description: 可以贴 `logs/fconv.log` 里相关的几行（记得去掉隐私内容）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过 issue，确认不是重复问题
          required: true
        - label: 我上传的内容里不含隐私或敏感文件
          required: true
