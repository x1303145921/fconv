name: 功能建议
description: 想新增格式、改进体验或加新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景和痛点，再说方案——这样更容易判断该怎么实现
      placeholder: "我经常要把手机拍的 HEIC 转成 jpg，现在得先……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: 大致属于哪类
      options:
        - 新增格式支持
        - 界面 / 交互改进
        - 命令行 / 接口改进
        - 性能 / 稳定性
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
    validations:
      required: false
