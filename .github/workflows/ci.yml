name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 发布前自检（版本一致 / 无密钥 / 文档链接 / 启动器编码）
        run: python scripts/check_release.py --strict

      - name: 语法检查（compileall）
        run: python -m compileall -q src

      - name: 单元测试
        run: python -m pytest tests/ -q

      - name: 覆盖率（仅 Linux 3.12 跑一次）
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=src/fconv --cov-report=term-missing

      - name: 格式矩阵冒烟（不含 FFmpeg 的音视频）
        run: python benchmarks/smoke_test.py
